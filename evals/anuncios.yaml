# Conceptos de anuncio
# Generado para Promptfoo (C3 de docs/STACK-AGENTICO.md). Corre con `pnpm run evals` (usa GPU).
# Casos inventados: sin canales reales ni personas identificables.
description: Tres conceptos distintos con guion de 45 a 90 palabras y sin cifras sin respaldo
# El prompt real lo arma evals/proveedor.ts con las variables del caso (las recibe en el contexto).
prompts: ['{{ __suite }}']
providers:
  - id: 'exec: npx tsx proveedor.ts gemma4:26b anuncios'
    label: gemma4-26b
  - id: 'exec: npx tsx proveedor.ts gemma4:12b anuncios'
    label: gemma4-12b
evaluateOptions:
  maxConcurrency: 1
defaultTest:
  vars:
    __suite: anuncios
  options:
    provider:
      id: 'exec: npx tsx proveedor.ts gemma4:26b juez'
  assert:
    - type: is-json
    # JSON Schema 2020-12 con el Ajv de Geeper (el de Promptfoo es draft-07).
    - type: javascript
      value: file://aserciones.ts:esquema_ideas_anuncio
    - type: javascript
      value: file://aserciones.ts:anuncios
    - type: llm-rubric
      weight: 0.5
      value: "Los tres conceptos son materialmente distintos, cada guion abre con el gancho y cierra con un llamado a la acción, no inventa cifras, testimonios ni urgencia y suena natural en español."
tests:
  - description: Mareas Claras
    vars:
      marca: "Mareas Claras"
      producto: "App que avisa la marea y el oleaje de la playa elegida"
      audiencia: "Personas que surfean o pescan los fines de semana"
      oferta: "Prueba gratis de 14 días"
      afirmaciones: |-
        Avisa la marea alta y baja del día
        Funciona sin cuenta
  - description: Huerto en Balcón
    vars:
      marca: "Huerto en Balcón"
      producto: "Kit para cultivar hierbas en macetas pequeñas"
      audiencia: "Gente que vive en departamento y nunca cultivó nada"
      oferta: "Envío sin costo en la primera compra"
      afirmaciones: |-
        Trae semillas de albahaca, perejil y cilantro
        Incluye guía paso a paso
  - description: Bici Taller Móvil
    vars:
      marca: "Bici Taller Móvil"
      producto: "Servicio que repara bicicletas en tu casa"
      audiencia: "Ciclistas urbanos sin tiempo para llevar la bici al taller"
      oferta: "Revisión básica a domicilio"
      afirmaciones: |-
        El técnico va a tu casa
        Se agenda por mensaje
