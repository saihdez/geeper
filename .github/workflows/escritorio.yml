# Instaladores de la app de escritorio (docs/ESCRITORIO.md). Cada sistema se construye en su propia
# máquina: Windows (.exe NSIS) y macOS Apple Silicon (.dmg). A mano desde la pestaña Actions, o al subir
# una etiqueta v* (entonces también crea la release con los instaladores).
#
# Para gastar poco (repo privado: los minutos de macOS cuentan 10 veces): en las ramas de integración
# sólo Windows (la PC del dueño); macOS en las etiquetas y a mano. Un push nuevo cancela el build que
# estaba corriendo en la misma rama, y los cambios que sólo tocan documentación no arman nada.
name: Escritorio

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    # Las ramas de integración también arman los instaladores (el botón «Run workflow» sólo aparece
    # cuando el flujo ya está en main).
    branches: ["integracion/**"]
    # Cambios sólo de documentación o del sitio no cambian el instalador (las etiquetas no miran esto).
    paths-ignore: ["sitio/**", "**.md", "docs/**", ".claude/**"]

permissions:
  contents: read

concurrency:
  group: escritorio-${{ github.ref }}
  # Las etiquetas (releases) no se cancelan nunca.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  instalador:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && fromJSON('["windows-2022"]') || fromJSON('["windows-2022","macos-15"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm typecheck
      # Las pruebas que no dependen del estudio de desarrollo (ffmpeg en ~/.local, mpt_acabado, WSL):
      # las de la app de escritorio, que tienen que pasar en Windows y en macOS.
      - run: pnpm test:escritorio
      # Las de la carcasa y del empaquetado (escritorio/, scripts/escritorio/), también en los dos sistemas.
      - run: pnpm exec vitest run tests/escritorio-carcasa.test.ts tests/escritorio-armado.test.ts tests/escritorio-vigia.test.ts tests/escritorio-probar-app.test.ts tests/ci-escritorio.test.ts
      - run: pnpm escritorio:empaquetar
      # Ramas de integración: el instalador de Windows va a la release fija «integracion» (se reemplaza en
      # cada build). Las releases no cuentan en el espacio de artefactos (500 MB en la cuenta gratis, se
      # llenaba con dos instaladores). Así lo baja la instalación de la PC del dueño.
      - if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: integracion
          name: Integración (último build)
          prerelease: true
          make_latest: false
          body: "Commit ${{ github.sha }} de ${{ github.ref_name }}. Se reemplaza en cada build."
          files: |
            dist-escritorio/*.exe
            dist-escritorio/latest*.yml
      - if: "!(github.event_name == 'push' && startsWith(github.ref, 'refs/heads/'))"
        uses: actions/upload-artifact@v4
        with:
          name: geeper-${{ matrix.os }}
          path: |
            dist-escritorio/*.exe
            dist-escritorio/*.dmg
            dist-escritorio/latest*.yml
          if-no-files-found: error
          # Cada instalador pesa ~300 MB: con los 90 días de siempre se llenó el espacio de la cuenta (19 GB) y
          # los builds dejaron de guardarse. Alcanza con 2 días para instalarlo; las versiones publicadas van
          # en la release (abajo). Ya vienen comprimidos (.exe, .dmg).
          retention-days: 2
          compression-level: 0

  # Sólo con una etiqueta v*: la release es el único paso que necesita escribir en el repo.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: instalador
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-escritorio
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-escritorio/*.exe
            dist-escritorio/*.dmg
