    <linearGradient id="acento" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ea6ff"/>
      <stop offset="1" stop-color="#3b5bdb"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="#0b0d12"/>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="none" stroke="#262c38" stroke-width="8"/>
  <!-- Una «G» abierta que rodea el botón de reproducir: de la idea al video. -->
